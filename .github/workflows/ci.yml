name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: watchusee
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d watchusee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Banco de dados exclusivo do CI.
    # Essas variáveis sobrescrevem as configurações
    # esperadas pela aplicação durante os testes.
    env:
      SUPABASE_URL: jdbc:postgresql://localhost:5432/watchusee
      SUPABASE_USERNAME: postgres
      SUPABASE_PASSWORD: postgres

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tornar Maven Wrapper executável
        run: chmod +x mvnw

      - name: Verificar versão do Java
        run: java -version

      - name: Verificar versão do Maven
        run: ./mvnw --version

      - name: Build e testes
        run: ./mvnw -B clean verify

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar artefato da aplicação
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: watchusee
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
