services:
  app:
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Ddebug=true -Dspring.devtools.add-properties=false"
    restart: "no"

  db:
    ports:
      - "5432:5432"
    environment:
      TZ: America/Sao_Paulo
    restart: "no"

  tmdb-mock:
    ports:
      - "1080:1080"
    restart: "no"